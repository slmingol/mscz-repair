<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <style>
    :root {
      --bg: #0C0F14;
      --staff: rgba(255,255,255,0.06);
      --title: #E4ECF4;
      --accent: #E8B84B;
      --sub: #4D6070;
      --bar: #E8B84B;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F0F4F9;
        --staff: rgba(0,0,0,0.09);
        --title: #0C0F14;
        --accent: #B5892A;
        --sub: #5C6E82;
        --bar: #B5892A;
      }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="260" fill="var(--bg)"/>

  <!-- Staff lines — span full width, cross through the cat mascot on the left -->
  <line x1="0" y1="88"  x2="1200" y2="88"  stroke="var(--staff)" stroke-width="1.5"/>
  <line x1="0" y1="102" x2="1200" y2="102" stroke="var(--staff)" stroke-width="1.5"/>
  <line x1="0" y1="116" x2="1200" y2="116" stroke="var(--staff)" stroke-width="1.5"/>
  <line x1="0" y1="130" x2="1200" y2="130" stroke="var(--staff)" stroke-width="1.5"/>
  <line x1="0" y1="144" x2="1200" y2="144" stroke="var(--staff)" stroke-width="1.5"/>

  <!-- ============================================================
       CAT MASCOT — tuxedo cat with tool belt fixing a .mscz file
       translate(30, 0): cat occupies x=30–230 in banner space
       ============================================================ -->
  <g transform="translate(30, 0)">

    <!-- Tail (behind body) -->
    <path d="M 128 192 Q 168 174 164 144 Q 162 128 150 134"
          fill="none" stroke="#1a1a1a" stroke-width="13" stroke-linecap="round"/>

    <!-- Left arm – raised, holding wrench -->
    <path d="M 72 140 Q 48 128 36 106"
          fill="none" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
    <ellipse cx="33" cy="102" rx="11" ry="8" fill="#f0f0f0"/>

    <!-- Wrench (socket style) in left paw -->
    <g transform="translate(28,84) rotate(-38)">
      <rect x="-4.5" y="2" width="9" height="26" rx="4" fill="#96A8B8"/>
      <polygon points="0,-14 8,-10 8,-1 0,3 -8,-1 -8,-10" fill="#96A8B8"/>
      <polygon points="0,-11 5,-8 5,-3 0,0 -5,-3 -5,-8" fill="#2a2a2a"/>
      <line x1="-1.5" y1="5" x2="-1.5" y2="24" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Right arm – holding document -->
    <path d="M 128 140 Q 152 134 162 152"
          fill="none" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
    <ellipse cx="165" cy="156" rx="11" ry="8" fill="#f0f0f0"/>

    <!-- .mscz document in right paw -->
    <g transform="translate(151,110) rotate(6)">
      <path d="M 2 2 L 34 2 L 40 9 L 40 54 L 2 54 Z" fill="rgba(0,0,0,0.2)"/>
      <path d="M 0 0 L 32 0 L 38 7 L 38 52 L 0 52 Z" fill="#EDF1F7"/>
      <path d="M 32 0 L 32 7 L 38 7 Z" fill="#C8D2DE"/>
      <!-- 5 staff lines (amber) -->
      <line x1="4" y1="17" x2="35" y2="17" stroke="#E8B84B" stroke-width="0.9"/>
      <line x1="4" y1="21" x2="35" y2="21" stroke="#E8B84B" stroke-width="0.9"/>
      <line x1="4" y1="25" x2="35" y2="25" stroke="#E8B84B" stroke-width="0.9"/>
      <line x1="4" y1="29" x2="35" y2="29" stroke="#E8B84B" stroke-width="0.9"/>
      <line x1="4" y1="33" x2="35" y2="33" stroke="#E8B84B" stroke-width="0.9"/>
      <!-- Treble clef (simplified) -->
      <path d="M 9,34 C 9,34 7,30 9,27 C 11,24 13,25 13,27 C 13,30 10,33 9,35 C 8,37 8,40 11,40 C 14,40 15,37 14,35 C 13,31 9,17 10,13 C 11,9 14,10 14,13"
            stroke="#0C0F14" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <!-- Quarter note -->
      <ellipse cx="24" cy="26" rx="3.5" ry="2.8" transform="rotate(-15,24,26)" fill="#0C0F14"/>
      <line x1="27" y1="25" x2="27" y2="14" stroke="#0C0F14" stroke-width="1.2"/>
      <!-- .mscz label -->
      <text x="4" y="49" font-size="5.5" fill="#5C6E82" font-family="'SF Mono', Menlo, monospace">.mscz</text>
    </g>

    <!-- Body -->
    <rect x="70" y="120" width="60" height="82" rx="22" fill="#1a1a1a"/>

    <!-- White chest bib -->
    <ellipse cx="100" cy="148" rx="18" ry="27" fill="#f5f5f5"/>

    <!-- Tool belt -->
    <rect x="68" y="166" width="64" height="17" rx="5" fill="#7B5520"/>
    <line x1="70" y1="169" x2="130" y2="169" stroke="rgba(0,0,0,0.25)" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="70" y1="180" x2="130" y2="180" stroke="rgba(0,0,0,0.25)" stroke-width="0.8" stroke-dasharray="3,3"/>
    <!-- Buckle (amber brand color) -->
    <rect x="90" y="166" width="20" height="17" rx="3" fill="#E8B84B"/>
    <rect x="93" y="169" width="14" height="11" rx="1.5" fill="rgba(0,0,0,0.18)"/>
    <rect x="99" y="169" width="2" height="11" rx="1" fill="#B5892A"/>
    <!-- Left tool loop -->
    <rect x="74" y="164" width="9" height="13" rx="2.5" fill="#5E3E18"/>
    <rect x="76" y="161" width="5" height="7" rx="2" fill="#96A8B8"/>
    <!-- Right tool loop -->
    <rect x="117" y="164" width="9" height="13" rx="2.5" fill="#5E3E18"/>
    <rect x="119.5" y="161" width="4" height="8" rx="2" fill="#D06030"/>
    <rect x="120.5" y="168" width="2" height="3" fill="#C8A878"/>

    <!-- Legs -->
    <rect x="78" y="198" width="18" height="30" rx="9" fill="#1a1a1a"/>
    <rect x="104" y="198" width="18" height="30" rx="9" fill="#1a1a1a"/>
    <!-- Feet -->
    <ellipse cx="87" cy="230" rx="14" ry="7" fill="#f0f0f0"/>
    <ellipse cx="113" cy="230" rx="14" ry="7" fill="#f0f0f0"/>
    <!-- Toe creases -->
    <line x1="83" y1="225" x2="83" y2="234" stroke="#d0d0d0" stroke-width="0.8"/>
    <line x1="87" y1="224" x2="87" y2="235" stroke="#d0d0d0" stroke-width="0.8"/>
    <line x1="91" y1="225" x2="91" y2="234" stroke="#d0d0d0" stroke-width="0.8"/>
    <line x1="109" y1="225" x2="109" y2="234" stroke="#d0d0d0" stroke-width="0.8"/>
    <line x1="113" y1="224" x2="113" y2="235" stroke="#d0d0d0" stroke-width="0.8"/>
    <line x1="117" y1="225" x2="117" y2="234" stroke="#d0d0d0" stroke-width="0.8"/>

    <!-- Ears (drawn before head so head covers their bases) -->
    <polygon points="62,40 50,6 88,32" fill="#1a1a1a"/>
    <polygon points="138,40 150,6 112,32" fill="#1a1a1a"/>

    <!-- Head -->
    <circle cx="100" cy="66" r="50" fill="#1a1a1a"/>

    <!-- Inner ears (pink) -->
    <polygon points="63,38 55,14 85,31" fill="#C4687A"/>
    <polygon points="137,38 145,14 115,31" fill="#C4687A"/>

    <!-- White face patch (tuxedo muzzle marking) -->
    <ellipse cx="100" cy="86" rx="22" ry="18" fill="#f5f5f5"/>

    <!-- Left eye -->
    <ellipse cx="81" cy="60" rx="12.5" ry="14" fill="#fff"/>
    <ellipse cx="81" cy="62" rx="9" ry="10.5" fill="#3EC688"/>
    <ellipse cx="81" cy="62" rx="5" ry="7.5" fill="#0d0d0d"/>
    <circle cx="85" cy="57" r="3" fill="white"/>
    <!-- Right eye -->
    <ellipse cx="119" cy="60" rx="12.5" ry="14" fill="#fff"/>
    <ellipse cx="119" cy="62" rx="9" ry="10.5" fill="#3EC688"/>
    <ellipse cx="119" cy="62" rx="5" ry="7.5" fill="#0d0d0d"/>
    <circle cx="123" cy="57" r="3" fill="white"/>

    <!-- Nose -->
    <polygon points="100,80 94,89 106,89" fill="#E8A4AC"/>
    <line x1="100" y1="89" x2="100" y2="94" stroke="#888" stroke-width="1.2"/>
    <!-- Mouth -->
    <path d="M 92,94 Q 100,100 108,94" stroke="#888" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="55" y1="84" x2="88" y2="88" stroke="rgba(220,228,236,0.55)" stroke-width="1.2"/>
    <line x1="53" y1="89" x2="87" y2="90" stroke="rgba(220,228,236,0.55)" stroke-width="1.2"/>
    <line x1="57" y1="94" x2="88" y2="92" stroke="rgba(220,228,236,0.55)" stroke-width="1.2"/>
    <line x1="145" y1="84" x2="112" y2="88" stroke="rgba(220,228,236,0.55)" stroke-width="1.2"/>
    <line x1="147" y1="89" x2="113" y2="90" stroke="rgba(220,228,236,0.55)" stroke-width="1.2"/>
    <line x1="143" y1="94" x2="112" y2="92" stroke="rgba(220,228,236,0.55)" stroke-width="1.2"/>

    <!-- Floating musical notes -->
    <text x="152" y="56" font-size="15" fill="#E8B84B" opacity="0.65" font-family="serif">♩</text>
    <text x="164" y="40" font-size="10" fill="#E8B84B" opacity="0.45" font-family="serif">♪</text>
    <text x="37" y="72" font-size="11" fill="#E8B84B" opacity="0.45" font-family="serif">♫</text>

  </g>
  <!-- ============================================================ -->

  <!-- Opening barline — right of the cat, at x=252 -->
  <line x1="252" y1="83" x2="252" y2="149" stroke="var(--bar)" stroke-width="2.5"/>

  <!-- Final barline: thin + thick -->
  <line x1="1134" y1="83" x2="1134" y2="149" stroke="var(--bar)" stroke-width="1.5"/>
  <line x1="1141" y1="83" x2="1141" y2="149" stroke="var(--bar)" stroke-width="5"/>

  <!-- Title — centered in the space right of the cat (x=252 to x=1130) -->
  <text y="188" text-anchor="middle" x="691"
        font-family="'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-weight="600" font-size="52" letter-spacing="-0.5">
    <tspan fill="var(--title)">mscz</tspan><tspan fill="var(--accent)">-repair</tspan>
  </text>

  <!-- Tagline -->
  <text x="691" y="220" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', Helvetica Neue, sans-serif"
        font-size="17" fill="var(--sub)" letter-spacing="0.2">
    Fix stale MuseScore part excerpts that prevent loading
  </text>

</svg>
